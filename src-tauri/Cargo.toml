[package]
name = "headroom"
version = "0.1.1"
description = "A tiny desktop widget for your Claude plan limits"
authors = ["Will Kline"]
license = "MIT"
repository = "https://github.com/WillKline1998/headroom"
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (a Windows quirk).
name = "headroom_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["time", "sync", "macros"] }
dirs = "6"
thiserror = "2"
rusqlite = { version = "0.37", features = ["bundled"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
