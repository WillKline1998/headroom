# Run: cargo install --locked cargo-deny && cd src-tauri && cargo deny check licenses
# Headroom is MIT and shipped as binaries; only licenses compatible with that are allowed.
[graph]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
]

[licenses]
confidence-threshold = 0.9
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "Unlicense",
  "CC0-1.0",
  "BSL-1.0",            # Boost: permissive (ryu, dual-licensed with Apache-2.0)
  "Unicode-3.0",        # ICU data/tables: attribution only
  "CDLA-Permissive-2.0",# webpki-roots CA bundle
  "MPL-2.0",            # file-level copyleft; cssparser/selectors/option-ext are unmodified deps (see docs/DECISIONS.md)
]
